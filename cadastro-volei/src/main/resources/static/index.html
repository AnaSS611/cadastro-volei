<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Jogadores de Vôlei</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🏐 Gestão de Jogadores de Vôlei</h1>

    <div id="feedback"></div>

    <div class="card-grid">
        <!-- 1. POST: Salvar Jogador -->
        <div class="card">
            <h2>1. Cadastrar Jogador (POST)</h2>
            <form id="formSalvar">
                <div class="form-group">
                    <label for="postNome">Nome:</label>
                    <input type="text" id="postNome" required>
                </div>
                <div class="form-group">
                    <label for="postIdade">Idade:</label>
                    <input type="number" id="postIdade" required>
                </div>
                <div class="form-group">
                    <label for="postPosicao">Posição:</label>
                    <input type="text" id="postPosicao" required>
                </div>
                <div class="form-group">
                    <label for="postTime">Time:</label>
                    <input type="text" id="postTime" required>
                </div>
                <button type="submit" class="btn-primary">Cadastrar</button>
            </form>
        </div>

        <!-- 2. GET: Buscar Jogador -->
        <div class="card">
            <h2>2. Buscar Jogador por Nome (GET)</h2>
            <div class="form-group">
                <label for="getNome">Nome do Jogador:</label>
                <input type="text" id="getNome">
            </div>
            <button id="btnBuscar" class="btn-primary">Buscar</button>

            <div id="resultadoBusca" class="result-box">
                <p><strong>ID:</strong> <span id="resId"></span></p>
                <p><strong>Nome:</strong> <span id="resNome"></span></p>
                <p><strong>Idade:</strong> <span id="resIdade"></span></p>
                <p><strong>Posição:</strong> <span id="resPosicao"></span></p>
                <p><strong>Time:</strong> <span id="resTime"></span></p>
            </div>
        </div>

        <!-- 3. PUT: Atualizar Jogador -->
        <div class="card">
            <h2>3. Atualizar Jogador por ID (PUT)</h2>
            <form id="formAtualizar">
                <div class="form-group">
                    <label for="putId">ID do Jogador (Obrigatório):</label>
                    <input type="number" id="putId" required>
                </div>
                <div class="form-group">
                    <label for="putNome">Novo Nome (Opcional):</label>
                    <input type="text" id="putNome">
                </div>
                <div class="form-group">
                    <label for="putIdade">Nova Idade (Opcional):</label>
                    <input type="number" id="putIdade">
                </div>
                <div class="form-group">
                    <label for="putPosicao">Nova Posição (Opcional):</label>
                    <input type="text" id="putPosicao">
                </div>
                <div class="form-group">
                    <label for="putTime">Novo Time (Opcional):</label>
                    <input type="text" id="putTime">
                </div>
                <button type="submit" class="btn-warning">Atualizar</button>
            </form>
        </div>

        <!-- 4. DELETE: Deletar Jogador -->
        <div class="card">
            <h2>4. Deletar Jogador por Nome (DELETE)</h2>
            <div class="form-group">
                <label for="deleteNome">Nome do Jogador a Deletar:</label>
                <input type="text" id="deleteNome">
            </div>
            <button id="btnDeletar" class="btn-danger">Deletar</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
